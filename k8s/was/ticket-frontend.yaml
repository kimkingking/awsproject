apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-frontend-deploy
  namespace: ticketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-frontend
  template:
    metadata:
      labels:
        app: ticket-frontend
    spec:
      containers:
      - name: nginx-frontend
        # 💡 프론트엔드 전용 이미지로 변경
        image: leeseonghoon234/ticket-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        - containerPort: 443
        resources:
          requests:
            cpu: "100m"      # 최소 보장 CPU
            memory: "128Mi"  # 최소 보장 메모리
          limits:
            cpu: "250m"      # 최대 사용 가능 CPU
            memory: "256Mi"  # 최대 사용 가능 메모리
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-frontend-svc
  namespace: ticketing
spec:
  type: NodePort
  selector:
    app: ticket-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
