apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseticket-kong-logic
  namespace: ticketing
  annotations:
    konghq.com/plugins: ticketing-bot-detection, ticketing-rate-limit
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      - path: /kopis-api
        pathType: Prefix
        backend:
          service:
            name: kopis-proxy-svc
            port:
              number: 443
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ticket-frontend-svc # <-- 찐 웹사이트 서비스 이름!
            port:
              number: 80
